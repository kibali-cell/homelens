[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelens"
version = "0.1.0"
description = "Learn the fundamentals of machine learning with one end-to-end project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "matplotlib>=3.8", "joblib>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]
